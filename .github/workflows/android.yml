name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/gen.sh'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: bash android/gen.sh
      - name: Build debug APK
        continue-on-error: true
        run: |
          cd android/proj
          gradle assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
      - name: Publish result
        run: |
          cd android
          mkdir -p dist
          if [ -f proj/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp proj/app/build/outputs/apk/debug/app-debug.apk dist/teleprompter.apk
            echo "OK" > dist/STATUS.txt
          else
            echo "FAIL" > dist/STATUS.txt
          fi
          date -u >> dist/STATUS.txt
          grep -nE "^e: |error:|FAILED|What went wrong|Could not" -A4 build.log | head -120 > dist/ERRORS.txt || true
          tail -n 80 build.log > dist/LOG_TAIL.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          git commit -m "Resultado de la compilacion" || true
          git push || true
